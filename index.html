<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graph DB Benchmark Results</title>

  <!-- Chart.js for bar charts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <style>
    /* =========================================================
       DESIGN PLAN
       Palette  : near-black #0d1117, surface #161b22, border #30363d,
                  accent-blue #58a6ff, accent-green #3fb950,
                  accent-orange #d29922, accent-red #f85149,
                  muted #8b949e, text #e6edf3
       Type     : "JetBrains Mono" for all data/labels (monospace = numbers
                  align, reads as technical artefact), "Inter" for prose
       Layout   : sticky header bar → KPI strip → tab nav → chart grid
                  → full results table
       Signature: Horizontal grouped bar charts where each DB is a coloured
                  lane — lets you read rank instantly without scanning a table
    ========================================================= */

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #1c2128;
      --border:    #30363d;
      --border2:   #21262d;
      --blue:      #58a6ff;
      --green:     #3fb950;
      --orange:    #d29922;
      --red:       #f85149;
      --purple:    #bc8cff;
      --muted:     #8b949e;
      --text:      #e6edf3;
      --text-dim:  #c9d1d9;
      --mono:      'JetBrains Mono', 'Fira Code', monospace;
      --sans:      'Inter', system-ui, sans-serif;
      --radius:    6px;
      --radius-lg: 10px;

      /* One colour per database — consistent across all charts */
      --db-cognodb:  #58a6ff;
      --db-neo4j:    #3fb950;
      --db-falkor:   #d29922;
      --db-arango:   #bc8cff;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ---- Header ---------------------------------------------------------- */
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(8px);
    }

    .header-left {
      display: flex; align-items: center; gap: 12px;
    }

    .logo {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--blue);
      letter-spacing: 0.04em;
    }

    .logo span { color: var(--muted); font-weight: 400; }

    .header-meta {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    #file-badge {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 320px;
    }

    /* ---- Main layout ------------------------------------------------------ */
    main { max-width: 1280px; margin: 0 auto; padding: 32px 24px 64px; }

    /* ---- File picker ------------------------------------------------------ */
    .file-picker-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .file-picker-row label {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    #file-select {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 10px;
      cursor: pointer;
      flex: 1;
      max-width: 480px;
    }

    #file-select:focus { outline: none; border-color: var(--blue); }

    .btn {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--bg);
      background: var(--blue);
      border: none;
      border-radius: var(--radius);
      padding: 7px 16px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }

    /* ---- KPI strip ------------------------------------------------------- */
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 32px;
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
    }

    .kpi-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .kpi-value {
      font-family: var(--mono);
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
      line-height: 1;
    }

    .kpi-sub {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ---- Section headings ------------------------------------------------ */
    .section-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 36px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border2);
    }

    .section-head h2 {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.03em;
    }

    .section-head .tag {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 7px;
    }

    /* ---- Chart grid ------------------------------------------------------- */
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
      gap: 16px;
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
    }

    .chart-title {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .chart-wrap {
      position: relative;
      height: 220px;
    }

    /* ---- DB legend -------------------------------------------------------- */
    .db-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
    }

    .db-legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-dim);
    }

    .db-legend-dot {
      width: 10px; height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* ---- Results table ---------------------------------------------------- */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--mono);
      font-size: 12px;
    }

    thead th {
      background: var(--surface2);
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--border2);
      transition: background 0.1s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }

    tbody td {
      padding: 9px 14px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    td.db-name {
      font-weight: 600;
    }

    td.num { color: var(--text); }

    td.best { color: var(--green); font-weight: 600; }
    td.caveat-cell {
      color: var(--muted);
      font-size: 11px;
      white-space: normal;
      max-width: 280px;
    }

    .workload-badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: var(--surface2);
    }

    /* ---- Empty / loading / error states ---------------------------------- */
    .state-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 64px 24px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 13px;
      text-align: center;
    }

    .state-box .icon { font-size: 32px; }
    .state-box .hint { font-size: 11px; color: var(--border); }

    /* ---- Ingest throughput bar ------------------------------------------ */
    .ingest-bar-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ingest-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ingest-db {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      width: 120px;
      flex-shrink: 0;
    }

    .ingest-track {
      flex: 1;
      height: 22px;
      background: var(--surface2);
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid var(--border2);
    }

    .ingest-fill {
      height: 100%;
      border-radius: 3px;
      display: flex;
      align-items: center;
      padding-left: 8px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--bg);
      font-weight: 600;
      transition: width 0.8s cubic-bezier(0.23,1,0.32,1);
      min-width: 2px;
    }

    /* ---- Responsive ------------------------------------------------------- */
    @media (max-width: 640px) {
      header { padding: 0 12px; }
      main   { padding: 20px 12px 48px; }
      .chart-grid { grid-template-columns: 1fr; }
      .kpi-strip  { grid-template-columns: repeat(2, 1fr); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ingest-fill { transition: none; }
    }

    /* ---- Skipped / error banner ------------------------------------------ */
    .skipped-banner {
      background: #1c1007;
      border: 1px solid #d29922;
      border-left: 4px solid #d29922;
      border-radius: var(--radius-lg);
      padding: 14px 20px;
      margin-bottom: 20px;
    }

    .skipped-banner-title {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: #d29922;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .skipped-banner-db {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .skipped-banner-reason {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .skipped-banner-fix {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<!-- ================================================================ Header -->
<header>
  <div class="header-left">
    <span class="logo">graph<span>bench</span></span>
    <span class="header-meta">CognoDB · Neo4j AuraDB · FalkorDB · ArangoDB</span>
  </div>
  <span id="file-badge">no results loaded</span>
</header>

<!-- ================================================================ Main -->
<main>

  <!-- File picker -->
  <div class="file-picker-row">
    <label for="file-select">Results file:</label>
    <select id="file-select">
      <option value="">— scanning results/ folder —</option>
    </select>
    <button class="btn" id="load-btn">Load</button>
    <input type="file" id="file-upload" accept=".json" style="display:none" />
    <button class="btn" id="upload-btn"
            style="background:var(--surface);color:var(--muted);border:1px solid var(--border);">
      Upload JSON
    </button>
  </div>

  <!-- Content area — replaced on each load -->
  <div id="content">
    <div class="state-box">
      <div class="icon">📂</div>
      <div>
        Place your <code>results_*.json</code> files in the <code>results/</code> folder,<br />
        then select a file above and click <strong>Load</strong>.<br /><br />
        Or click <strong>Upload JSON</strong> to open a file directly from disk.
      </div>
      <div class="hint">
        Files are read locally — nothing is sent to a server.
      </div>
    </div>
  </div>

</main>

<script>
/* ============================================================
   Configuration
   ============================================================ */
const RESULTS_DIR  = 'results/';
const DB_COLORS = {
  'CognoDB Cloud':    '#58a6ff',
  'Neo4j AuraDB Free':'#3fb950',
  'FalkorDB':         '#d29922',
  'ArangoDB':         '#bc8cff',
};
const DB_ORDER = Object.keys(DB_COLORS);

/* ============================================================
   Startup — try to list results/ folder
   ============================================================ */
window.addEventListener('DOMContentLoaded', async () => {
  await populateFileSelect();

  document.getElementById('load-btn').addEventListener('click', loadSelected);
  document.getElementById('upload-btn').addEventListener('click', () =>
    document.getElementById('file-upload').click());
  document.getElementById('file-upload').addEventListener('change', loadUploaded);
});

async function populateFileSelect() {
  const sel = document.getElementById('file-select');

  // Attempt to fetch the results directory listing.
  // Works when served from a local HTTP server (e.g. python -m http.server).
  // Falls back gracefully when opened as a file:// URL.
  try {
    const res  = await fetch(RESULTS_DIR);
    const html = await res.text();
    // Parse <a href="..."> links from the directory listing
    const matches = [...html.matchAll(/href="([^"]*results_[^"]*\.json)"/gi)];
    const files   = matches
      .map(m => m[1].replace(RESULTS_DIR, '').replace(/^.*\//, ''))
      .filter(f => f.endsWith('.json'))
      .sort()
      .reverse(); // latest first

    if (files.length === 0) {
      sel.innerHTML = '<option value="">No results_*.json files found in results/</option>';
      return;
    }

    sel.innerHTML = files
      .map((f, i) => `<option value="${RESULTS_DIR}${f}"${i===0?' selected':''}>${f}</option>`)
      .join('');

    // Update badge
    document.getElementById('file-badge').textContent = files[0];

    // Auto-load the latest file
    if (files.length > 0) loadSelected();

  } catch (e) {
    // file:// or CORS — ask user to upload directly
    sel.innerHTML = '<option value="">Cannot auto-list (use Upload JSON instead)</option>';
  }
}

async function loadSelected() {
  const url = document.getElementById('file-select').value;
  if (!url) return;
  try {
    const res  = await fetch(url + '?nocache=' + Date.now());
    const data = await res.json();
    document.getElementById('file-badge').textContent = url.split('/').pop();
    render(data);
  } catch (e) {
    showError(`Could not load ${url}: ${e.message}`);
  }
}

function loadUploaded(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      document.getElementById('file-badge').textContent = file.name;
      render(data);
    } catch (err) {
      showError('Invalid JSON file: ' + err.message);
    }
  };
  reader.readAsText(file);
}

/* ============================================================
   Skipped DB banner — shown when a database failed to connect
   ============================================================ */
function skippedBanner(skipped) {
  if (!skipped || skipped.length === 0) return '';

  const FIX_HINTS = {
    'FalkorDB': {
      summary: 'TLS/encryption mismatch — FalkorDB does not support TLS on port 7687.',
      fix: `Fix in FalkorDBBenchmark.java — driver already patched in latest version.
Also check your .env file:
  FALKORDB_URI=bolt://localhost:7687   ← must be bolt://, NOT bolt+s://

Then rebuild and re-run:
  mvn clean package -q
  java -jar target\\cognodb-benchmark-1.0.0.jar --db falkor`
    }
  };

  const cards = skipped.map(r => {
    const hint  = FIX_HINTS[r.database] || {};
    const color = dbColor(r.database);
    // Extract just the core error message (first sentence)
    const raw   = r.caveats || 'Unknown error';
    const short = raw.replace('SKIPPED — connection or setup error: ', '');

    return `
    <div style="margin-bottom: 12px;">
      <div class="skipped-banner-db" style="color:${color}">
        ⚠ ${r.database} — SKIPPED
      </div>
      <div class="skipped-banner-reason">
        ${hint.summary || short}
      </div>
      ${hint.fix ? `<div class="skipped-banner-fix">${hint.fix}</div>` : ''}
    </div>`;
  }).join('');

  return `
  <div class="skipped-banner">
    <div class="skipped-banner-title">
      🔧 ${skipped.length} database${skipped.length > 1 ? 's' : ''} skipped — connection failed during this run
    </div>
    ${cards}
  </div>`;
}

/* ============================================================
   Parse — normalise the JSON envelope into usable maps
   ============================================================ */
function parseResults(data) {
  const rows = data.results || (Array.isArray(data) ? data : []);

  // Separate SKIPPED (workload=ALL, caveats starts with SKIPPED) from real results
  const skipped = rows.filter(r =>
    r.workload === 'ALL' && r.caveats && r.caveats.startsWith('SKIPPED'));
  const valid   = rows.filter(r =>
    !(r.workload === 'ALL' && r.caveats && r.caveats.startsWith('SKIPPED')));

  // Group valid results: workload → database → BenchmarkResult
  const byWorkload = {};
  const databases  = new Set();

  valid.forEach(r => {
    if (!r.workload || !r.database) return;
    databases.add(r.database);
    if (!byWorkload[r.workload]) byWorkload[r.workload] = {};
    byWorkload[r.workload][r.database] = r;
  });

  // Also register skipped DBs so they appear in the legend/table
  skipped.forEach(r => { if (r.database) databases.add(r.database); });

  // Sort databases by the canonical order defined in DB_ORDER,
  // then any extras alphabetically
  const dbList = [...databases].sort((a, b) => {
    const ia = DB_ORDER.indexOf(a), ib = DB_ORDER.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });

  return { byWorkload, dbList, skipped, raw: rows, meta: data };
}

/* ============================================================
   Render — build the full dashboard
   ============================================================ */
function render(data) {
  const { byWorkload, dbList, skipped, raw, meta } = parseResults(data);
  const content = document.getElementById('content');

  if (!dbList.length) {
    showError('No valid benchmark results found in the JSON file.');
    return;
  }

  // Destroy any existing Chart.js instances to avoid canvas reuse warnings
  Chart.helpers.each(Chart.instances, c => c.destroy());

  const ingest = byWorkload['INGEST'] || {};
  const totalResults = raw.length;
  const generatedAt  = meta.generatedAt || '';
  const dateStr = generatedAt
    ? new Date(generatedAt).toLocaleString()
    : 'unknown';

  content.innerHTML = `
    ${skippedBanner(skipped)}
    ${kpiStrip(dbList, byWorkload)}
    ${legendHtml(dbList)}

    <div class="section-head">
      <h2>DATA LOADING</h2>
      <span class="tag">ingest throughput</span>
    </div>
    ${ingestSection(dbList, ingest)}

    <div class="section-head">
      <h2>TRAVERSAL LATENCY</h2>
      <span class="tag">p50 · p95 ms — lower is better</span>
    </div>
    <div class="chart-grid">
      ${latencyChart('hop-1', 'HOP_1', '1-Hop Neighbours', byWorkload, dbList)}
      ${latencyChart('hop-2', 'HOP_2', '2-Hop Neighbours', byWorkload, dbList)}
      ${latencyChart('hop-3', 'HOP_3', '3-Hop Neighbours', byWorkload, dbList)}
    </div>

    <div class="section-head">
      <h2>LOOKUP &amp; AGGREGATION</h2>
      <span class="tag">p50 · p95 ms — lower is better</span>
    </div>
    <div class="chart-grid">
      ${latencyChart('pt-lookup',  'POINT_LOOKUP',    'Point Lookup (indexed)', byWorkload, dbList)}
      ${latencyChart('flt-lookup', 'FILTERED_LOOKUP', 'Filtered Lookup (age range)', byWorkload, dbList)}
      ${latencyChart('agg',        'AGGREGATION',     'Aggregation (count by region)', byWorkload, dbList)}
    </div>

    <div class="section-head">
      <h2>MIXED CONCURRENT THROUGHPUT</h2>
      <span class="tag">queries / second — higher is better</span>
    </div>
    <div class="chart-grid">
      ${concurrentChart('mixed-c1',  'MIXED_C1',  '1 Client  (80% reads / 20% writes)', byWorkload, dbList)}
      ${concurrentChart('mixed-c10', 'MIXED_C10', '10 Clients (80% reads / 20% writes)', byWorkload, dbList)}
      ${concurrentChart('mixed-c40', 'MIXED_C40', '40 Clients (80% reads / 20% writes)', byWorkload, dbList)}
    </div>

    <div class="section-head">
      <h2>FULL RESULTS MATRIX</h2>
      <span class="tag">${totalResults} measurements · run ${dateStr}</span>
    </div>
    ${fullTable(dbList, byWorkload)}
  `;

  // Kick off Chart.js rendering (deferred so DOM is ready)
  requestAnimationFrame(() => initAllCharts(dbList, byWorkload));
}

/* ============================================================
   KPI Strip
   ============================================================ */
function kpiStrip(dbList, byWorkload) {
  const ingest = byWorkload['INGEST'] || {};

  // Best p50 point lookup across all DBs
  const lookups = byWorkload['POINT_LOOKUP'] || {};
  const bestLookup = dbList.reduce((best, db) => {
    const v = lookups[db]?.p50Ms;
    return (v > 0 && (best === null || v < best)) ? v : best;
  }, null);

  // Best 1-hop p50
  const hop1 = byWorkload['HOP_1'] || {};
  const bestHop = dbList.reduce((best, db) => {
    const v = hop1[db]?.p50Ms;
    return (v > 0 && (best === null || v < best)) ? v : best;
  }, null);

  // Fastest ingest (nodes/sec)
  const bestIngest = dbList.reduce((best, db) => {
    const v = ingest[db]?.nodesPerSecond;
    return (v > 0 && (best === null || v > best)) ? v : best;
  }, null);

  return `
  <div class="kpi-strip">
    <div class="kpi-card">
      <div class="kpi-label">Databases Tested</div>
      <div class="kpi-value">${dbList.length}</div>
      <div class="kpi-sub">${dbList.join(' · ')}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Best Point Lookup p50</div>
      <div class="kpi-value">${bestLookup !== null ? bestLookup.toFixed(1) : '—'}</div>
      <div class="kpi-sub">milliseconds</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Best 1-Hop p50</div>
      <div class="kpi-value">${bestHop !== null ? bestHop.toFixed(1) : '—'}</div>
      <div class="kpi-sub">milliseconds</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Best Ingest Rate</div>
      <div class="kpi-value">${bestIngest !== null ? Math.round(bestIngest).toLocaleString() : '—'}</div>
      <div class="kpi-sub">nodes / second</div>
    </div>
  </div>`;
}

/* ============================================================
   DB Legend
   ============================================================ */
function legendHtml(dbList) {
  const items = dbList.map(db => {
    const color = dbColor(db);
    return `<div class="db-legend-item">
      <div class="db-legend-dot" style="background:${color}"></div>
      ${db}
    </div>`;
  }).join('');
  return `<div class="db-legend">${items}</div>`;
}

/* ============================================================
   Ingest section — horizontal bar rows
   ============================================================ */
function ingestSection(dbList, ingest) {
  // Find max nodes/sec for scaling bars
  const maxNodes = dbList.reduce((m, db) => {
    const v = ingest[db]?.nodesPerSecond || 0;
    return v > m ? v : m;
  }, 1);
  const maxRels = dbList.reduce((m, db) => {
    const v = ingest[db]?.relationshipsPerSecond || 0;
    return v > m ? v : m;
  }, 1);

  const rows = dbList.map(db => {
    const r = ingest[db];
    if (!r) return '';
    const nps   = r.nodesPerSecond || 0;
    const rps   = r.relationshipsPerSecond || 0;
    const total = r.totalLoadMs ? `${(r.totalLoadMs/1000).toFixed(1)}s` : '—';
    const color = dbColor(db);
    const nPct  = Math.min((nps / maxNodes) * 100, 100);
    const rPct  = Math.min((rps / maxRels) * 100, 100);

    return `
    <div style="background:var(--surface);border:1px solid var(--border);
                border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;
                  align-items:baseline;margin-bottom:10px;">
        <span style="font-family:var(--mono);font-size:12px;
                     font-weight:600;color:${color}">${db}</span>
        <span style="font-family:var(--mono);font-size:11px;
                     color:var(--muted)">total load time: ${total}</span>
      </div>
      <div style="margin-bottom:6px;">
        <div style="font-family:var(--mono);font-size:10px;
                    color:var(--muted);margin-bottom:4px;
                    text-transform:uppercase;letter-spacing:.05em">
          Nodes/sec
        </div>
        <div class="ingest-track">
          <div class="ingest-fill" style="width:${nPct}%;background:${color}">
            ${nps > 0 ? Math.round(nps).toLocaleString() : '—'}
          </div>
        </div>
      </div>
      <div>
        <div style="font-family:var(--mono);font-size:10px;
                    color:var(--muted);margin-bottom:4px;
                    text-transform:uppercase;letter-spacing:.05em">
          Relationships/sec
        </div>
        <div class="ingest-track">
          <div class="ingest-fill"
               style="width:${rPct}%;background:${color};opacity:.75">
            ${rps > 0 ? Math.round(rps).toLocaleString() : '—'}
          </div>
        </div>
      </div>
      ${r.caveats ? `<div style="margin-top:8px;font-family:var(--mono);
        font-size:10px;color:var(--muted)">${r.caveats}</div>` : ''}
    </div>`;
  }).join('');

  return `<div>${rows}</div>`;
}

/* ============================================================
   Latency chart (p50 + p95 grouped bars)
   ============================================================ */
function latencyChart(id, workload, title, byWorkload, dbList) {
  return `
  <div class="chart-card">
    <div class="chart-title">${title}</div>
    <div class="chart-wrap">
      <canvas id="chart-${id}"></canvas>
    </div>
  </div>`;
}

/* ============================================================
   Concurrent throughput chart (QPS bars)
   ============================================================ */
function concurrentChart(id, workload, title, byWorkload, dbList) {
  return `
  <div class="chart-card">
    <div class="chart-title">${title}</div>
    <div class="chart-wrap">
      <canvas id="chart-${id}"></canvas>
    </div>
  </div>`;
}

/* ============================================================
   Full results table
   ============================================================ */
function fullTable(dbList, byWorkload) {
  const WORKLOADS = [
    'INGEST',
    'HOP_1','HOP_2','HOP_3',
    'POINT_LOOKUP','FILTERED_LOOKUP','AGGREGATION',
    'MIXED_C1','MIXED_C10','MIXED_C40',
  ];

  const headerCells = dbList.map(db =>
    `<th style="color:${dbColor(db)}">${db}</th>`).join('');

  const rows = WORKLOADS.map(wl => {
    const wlData = byWorkload[wl] || {};
    const isIngest  = wl === 'INGEST';
    const isMixed   = wl.startsWith('MIXED_');

    // Find best value for green highlight
    let bestVal = null;
    dbList.forEach(db => {
      const r = wlData[db];
      if (!r) return;
      let v = null;
      if (isIngest)  v = r.nodesPerSecond;
      else if (isMixed) v = r.queriesPerSecond;
      else v = r.p50Ms;
      if (v !== null && v >= 0) {
        if (bestVal === null) bestVal = v;
        else bestVal = isIngest || isMixed
          ? Math.max(bestVal, v)
          : Math.min(bestVal, v);
      }
    });

    const cells = dbList.map(db => {
      const r = wlData[db];
      if (!r) return '<td class="num" style="color:var(--muted)">—</td>';

      let primary, secondary, isBest = false;

      if (isIngest) {
        primary   = r.nodesPerSecond   > 0 ? `${Math.round(r.nodesPerSecond).toLocaleString()} n/s` : '—';
        secondary = r.totalLoadMs      > 0 ? `${(r.totalLoadMs/1000).toFixed(1)}s` : '';
        isBest    = r.nodesPerSecond === bestVal;
      } else if (isMixed) {
        primary   = r.queriesPerSecond > 0 ? `${r.queriesPerSecond.toFixed(1)} qps` : '—';
        secondary = r.concurrentClients ? `${r.concurrentClients}c` : '';
        isBest    = r.queriesPerSecond === bestVal;
      } else {
        primary   = r.p50Ms > 0 ? `${r.p50Ms.toFixed(1)}` : (r.caveats?.startsWith('FAILED') ? 'ERR' : '—');
        secondary = r.p95Ms > 0 ? `p95 ${r.p95Ms.toFixed(1)}` : '';
        isBest    = r.p50Ms === bestVal && r.p50Ms > 0;
      }

      const cls = isBest ? 'best' : 'num';
      return `<td class="${cls}">${primary}${secondary ? `<br/><span style="font-size:10px;color:var(--muted)">${secondary}</span>` : ''}</td>`;
    }).join('');

    return `<tr>
      <td><span class="workload-badge">${wl}</span></td>
      ${cells}
    </tr>`;
  }).join('');

  return `
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Workload</th>
          ${headerCells}
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  </div>
  <p style="font-family:var(--mono);font-size:11px;color:var(--muted);
            margin-top:10px;padding:0 4px">
    Latency in milliseconds (p50). Green = best in class.
    Higher is better for n/s and qps; lower is better for latency.
  </p>`;
}

/* ============================================================
   Chart.js initialisation — called after DOM is ready
   ============================================================ */
function initAllCharts(dbList, byWorkload) {
  const CHART_DEFAULTS = {
    responsive: true,
    maintainAspectRatio: false,
    animation: { duration: 600 },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#161b22',
        borderColor: '#30363d',
        borderWidth: 1,
        titleColor: '#e6edf3',
        bodyColor: '#8b949e',
        titleFont: { family: 'JetBrains Mono, monospace', size: 11 },
        bodyFont:  { family: 'JetBrains Mono, monospace', size: 11 },
        callbacks: {
          label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.x ?? ctx.parsed.y}`
        }
      }
    },
    scales: {
      x: {
        ticks: { color: '#8b949e', font: { family: 'JetBrains Mono', size: 10 } },
        grid:  { color: '#21262d' }
      },
      y: {
        ticks: { color: '#8b949e', font: { family: 'JetBrains Mono', size: 10 } },
        grid:  { color: '#21262d' }
      }
    }
  };

  // Latency workloads → grouped bar (p50 + p95)
  const latencyMap = {
    'chart-hop-1':  'HOP_1',
    'chart-hop-2':  'HOP_2',
    'chart-hop-3':  'HOP_3',
    'chart-pt-lookup':  'POINT_LOOKUP',
    'chart-flt-lookup': 'FILTERED_LOOKUP',
    'chart-agg':        'AGGREGATION',
  };

  Object.entries(latencyMap).forEach(([canvasId, workload]) => {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const wlData = byWorkload[workload] || {};

    const labels  = dbList;
    const p50data = dbList.map(db => wlData[db]?.p50Ms > 0 ? +wlData[db].p50Ms.toFixed(2) : 0);
    const p95data = dbList.map(db => wlData[db]?.p95Ms > 0 ? +wlData[db].p95Ms.toFixed(2) : 0);
    const colors  = dbList.map(db => dbColor(db));

    new Chart(canvas, {
      type: 'bar',
      data: {
        labels,
        datasets: [
          {
            label: 'p50 (ms)',
            data: p50data,
            backgroundColor: colors.map(c => c + 'cc'),
            borderColor: colors,
            borderWidth: 1,
            borderRadius: 3,
          },
          {
            label: 'p95 (ms)',
            data: p95data,
            backgroundColor: colors.map(c => c + '44'),
            borderColor: colors.map(c => c + '88'),
            borderWidth: 1,
            borderRadius: 3,
            borderDash: [4, 2],
          }
        ]
      },
      options: {
        ...CHART_DEFAULTS,
        plugins: {
          ...CHART_DEFAULTS.plugins,
          tooltip: {
            ...CHART_DEFAULTS.plugins.tooltip,
            callbacks: {
              label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y} ms`
            }
          }
        },
        scales: {
          x: CHART_DEFAULTS.scales.x,
          y: {
            ...CHART_DEFAULTS.scales.y,
            title: {
              display: true,
              text: 'ms',
              color: '#8b949e',
              font: { family: 'JetBrains Mono', size: 10 }
            }
          }
        }
      }
    });
  });

  // Mixed concurrent → horizontal bar (QPS)
  const mixedMap = {
    'chart-mixed-c1':  'MIXED_C1',
    'chart-mixed-c10': 'MIXED_C10',
    'chart-mixed-c40': 'MIXED_C40',
  };

  Object.entries(mixedMap).forEach(([canvasId, workload]) => {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const wlData = byWorkload[workload] || {};

    const labels  = dbList;
    const qpsData = dbList.map(db =>
      wlData[db]?.queriesPerSecond > 0
        ? +wlData[db].queriesPerSecond.toFixed(1)
        : 0);
    const colors = dbList.map(db => dbColor(db));

    new Chart(canvas, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: 'QPS',
          data: qpsData,
          backgroundColor: colors.map(c => c + 'cc'),
          borderColor: colors,
          borderWidth: 1,
          borderRadius: 3,
        }]
      },
      options: {
        ...CHART_DEFAULTS,
        indexAxis: 'y',
        plugins: {
          ...CHART_DEFAULTS.plugins,
          tooltip: {
            ...CHART_DEFAULTS.plugins.tooltip,
            callbacks: {
              label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.x} queries/sec`
            }
          }
        },
        scales: {
          x: {
            ...CHART_DEFAULTS.scales.x,
            title: {
              display: true,
              text: 'queries / sec',
              color: '#8b949e',
              font: { family: 'JetBrains Mono', size: 10 }
            }
          },
          y: CHART_DEFAULTS.scales.y
        }
      }
    });
  });
}

/* ============================================================
   Utilities
   ============================================================ */
function dbColor(db) {
  return DB_COLORS[db] || '#8b949e';
}

function showError(msg) {
  document.getElementById('content').innerHTML = `
    <div class="state-box">
      <div class="icon">⚠️</div>
      <div>${msg}</div>
      <div class="hint">Check the browser console for details.</div>
    </div>`;
}
</script>
</body>
</html>
